RecipeFormatVersion: '2020-01-25'
ComponentName: com.example.EdgeMonitor
ComponentVersion: '1.0.4'
ComponentDescription: Collects and publishes device hardware metrics.
ComponentPublisher: Prototype

ComponentConfiguration:
  DefaultConfiguration:
    accessControl:
      aws.greengrass.ipc.mqttproxy:
        "com.example.EdgeMonitor:pub:1":
          policyDescription: Allow publishing hardware metrics to IoT Core.
          operations:
            - aws.greengrass#PublishToIoTCore
          resources:
            - devices/*/metrics

Manifests:
  - Platform:
      os: linux
    Lifecycle:
      Setenv:
        EDGE_MONITOR_SPOOL_PATH: "{work:path}/metrics.sqlite3"
      Install: |-
        python3.8 -m venv {work:path}/venv
        {work:path}/venv/bin/pip install --disable-pip-version-check -r {artifacts:path}/requirements.txt
      Run: |-
        {work:path}/venv/bin/python {artifacts:path}/edge_monitor.py
    Artifacts:
      - URI: s3://edge-monitor-artifacts/com.example.EdgeMonitor/1.0.4/constants.py
      - URI: s3://edge-monitor-artifacts/com.example.EdgeMonitor/1.0.4/edge_monitor.py
      - URI: s3://edge-monitor-artifacts/com.example.EdgeMonitor/1.0.4/gpu_metrics.py
      - URI: s3://edge-monitor-artifacts/com.example.EdgeMonitor/1.0.4/greengrass_publisher.py
      - URI: s3://edge-monitor-artifacts/com.example.EdgeMonitor/1.0.4/metrics_spool.py
      - URI: s3://edge-monitor-artifacts/com.example.EdgeMonitor/1.0.4/requirements.txt
